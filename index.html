<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bossy R Rescue</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: Chalkboard, "Chalkboard SE", "Comic Sans MS", "Comic Neue", cursive;
         background: linear-gradient(160deg, #ffe3f1 0%, #e8dcff 55%, #d6f0ff 100%); color: #3b2453;
         min-height: 100vh; text-align: center; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 2.3rem; margin: 10px 0 2px; color: #8a2be2; text-shadow: 2px 2px 0 #fff; }
  .sub { font-size: 1.1rem; margin-bottom: 14px; }
  .card { background: #fff; border-radius: 22px; padding: 18px; box-shadow: 0 6px 0 #c9b3ef; margin-bottom: 14px; }
  .btn { display: block; width: 100%; font-family: inherit; font-size: 1.35rem; border: none; border-radius: 18px;
         padding: 16px; margin: 10px 0; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.18); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
  .pink { background: #ff5fa2; } .purple { background: #9b5de5; } .blue { background: #00a6ed; } .green { background: #2ec27e; }
  .gray { background: #9a8fb0; }
  .rule { font-size: 1.05rem; line-height: 1.5; text-align: left; }
  .rule b { color: #ff5fa2; }
  .hud { display: flex; justify-content: space-between; font-size: 1.15rem; margin-bottom: 8px; }
  .word { font-size: 2.6rem; letter-spacing: 4px; margin: 14px 0; min-height: 60px; }
  .blank { display: inline-block; min-width: 70px; border-bottom: 5px solid #ff5fa2; color: #ff5fa2; }
  .choices { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .choice { font-family: inherit; font-size: 2rem; padding: 14px 22px; border-radius: 16px; border: none;
            background: #ffd6ea; color: #3b2453; box-shadow: 0 5px 0 #ff9cc8; cursor: pointer; min-width: 90px; }
  .tiles { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
  .tile { font-family: inherit; font-size: 1.9rem; width: 54px; height: 60px; border-radius: 12px; border: none;
          background: #e2d4ff; color: #3b2453; box-shadow: 0 4px 0 #b79cf0; cursor: pointer; }
  .tile.used { visibility: hidden; }
  .answer { font-size: 2.4rem; min-height: 64px; letter-spacing: 4px; border-bottom: 4px dashed #c9b3ef; margin: 8px 0; }
  .answer span.ok { color: #2ec27e; } .answer span.bad { color: #e5484d; }
  .msg { font-size: 1.25rem; min-height: 56px; margin: 8px 0; }
  .row { display: flex; gap: 10px; } .row .btn { margin: 6px 0; }
  .say { font-size: 1.2rem; background: #fff3a8; color: #3b2453; box-shadow: 0 5px 0 #e6cf4f; }
  .stars { font-size: 2.2rem; }
  .hidden { display: none; }
  .best { font-size: 1rem; color: #7a6496; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🦸‍♀️ Bossy R Rescue</h1>
  <div class="sub">Skills 3 • Lesson 5 • Test Oct. 22</div>

  <!-- MENU -->
  <div id="menu">
    <div class="card rule">
      When <b>R</b> comes after a vowel, R is the boss! 👑 It changes the vowel's sound:<br>
      <b>er</b> says "er" like sist<b>er</b><br>
      <b>or</b> says "or" like b<b>or</b>n<br>
      <b>ar</b> says "ar" like m<b>ar</b>k<br>
      Tricky word: <b>some</b> (it sounds like "sum" but it's spelled s-o-m-e!)
    </div>
    <button class="btn pink" onclick="startGame(1)">1️⃣ Which Bossy R? (er, or, ar)</button>
    <button class="btn purple" onclick="startGame(2)">2️⃣ Build It! (letter tiles)</button>
    <button class="btn blue" onclick="startGame(3)">3️⃣ Listen &amp; Spell (test practice)</button>
    <div class="best" id="bestLine"></div>
  </div>

  <!-- GAME -->
  <div id="game" class="hidden">
    <div class="card">
      <div class="hud"><span id="modeName"></span><span>⭐ <span id="score">0</span></span><span id="prog"></span></div>
      <button class="btn say" onclick="sayWord()">🔊 Hear the word</button>
      <div class="word" id="wordShow"></div>
      <div class="choices" id="choices"></div>
      <div class="answer hidden" id="answer"></div>
      <div class="tiles" id="tiles"></div>
      <div class="msg" id="msg"></div>
      <div class="row" id="tileBtns">
        <button class="btn gray" onclick="undoTile()">⬅️ Undo</button>
        <button class="btn green" onclick="check()">✅ Check</button>
      </div>
      <button class="btn green hidden" id="nextBtn" onclick="nextWord()">Next ➡️</button>
    </div>
    <button class="btn gray" onclick="showMenu()">🏠 Menu</button>
  </div>

  <!-- END -->
  <div id="end" class="hidden">
    <div class="card">
      <div class="stars" id="endStars"></div>
      <h2 id="endTitle"></h2>
      <div class="msg" id="endMsg"></div>
    </div>
    <button class="btn pink" onclick="startGame(mode)">🔁 Play again</button>
    <button class="btn purple" onclick="showMenu()">🏠 Menu</button>
  </div>
</div>

<script>
var WORDS = [
  { w: "sister",   r: "er", parts: ["sist", "er", ""],   sent: "My sister is my best friend." },
  { w: "letter",   r: "er", parts: ["lett", "er", ""],   sent: "I wrote a letter to Grandma." },
  { w: "expert",   r: "er", parts: ["exp", "er", "t"],   sent: "She is an expert at cartwheels." },
  { w: "born",     r: "or", parts: ["b", "or", "n"],     sent: "The puppy was born in the spring." },
  { w: "sports",   r: "or", parts: ["sp", "or", "ts"],   sent: "We love to play sports." },
  { w: "short",    r: "or", parts: ["sh", "or", "t"],    sent: "The movie was short." },
  { w: "mark",     r: "ar", parts: ["m", "ar", "k"],     sent: "Put a check mark on the paper." },
  { w: "started",  r: "ar", parts: ["st", "ar", "ted"],  sent: "The game started at noon." },
  { w: "backyard", r: "ar", parts: ["backy", "ar", "d"], sent: "We played tag in the backyard." },
  { w: "some",     r: "",   parts: ["", "", ""],         sent: "Can I have some popcorn?", tricky: true }
];
var mode = 1, queue = [], idx = 0, score = 0, cur = null, built = [], usedTiles = [], done = false, firstTry = true, missed = [];
var MODE_NAMES = { 1: "Which Bossy R?", 2: "Build It!", 3: "Listen & Spell" };

function $(id) { return document.getElementById(id); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function speak(t) { try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.rate = 0.8; speechSynthesis.speak(u); } catch (e) {} }
function sayWord() { if (cur) speak(cur.w + ". " + cur.sent + " " + cur.w + "."); }
function bestKey(m) { return "bossyR_best_" + m; }
function showBest() {
  var s = [];
  for (var m = 1; m <= 3; m++) { var b = localStorage.getItem(bestKey(m)); if (b) s.push(MODE_NAMES[m] + ": " + b + "⭐"); }
  $("bestLine").textContent = s.length ? "Best scores: " + s.join(" • ") : "";
}
function showMenu() { $("menu").classList.remove("hidden"); $("game").classList.add("hidden"); $("end").classList.add("hidden"); showBest(); }

function startGame(m) {
  mode = m; score = 0; idx = 0; missed = [];
  queue = shuffle(m === 1 ? WORDS.filter(function (x) { return !x.tricky; }) : WORDS);
  $("menu").classList.add("hidden"); $("end").classList.add("hidden"); $("game").classList.remove("hidden");
  $("modeName").textContent = MODE_NAMES[m];
  loadWord();
}

function loadWord() {
  cur = queue[idx]; built = []; usedTiles = []; done = false; firstTry = true;
  $("score").textContent = score; $("prog").textContent = (idx + 1) + "/" + queue.length;
  $("msg").textContent = ""; $("nextBtn").classList.add("hidden");
  $("choices").innerHTML = ""; $("tiles").innerHTML = ""; $("answer").innerHTML = "";
  if (mode === 1) {
    $("answer").classList.add("hidden"); $("tileBtns").classList.add("hidden");
    $("wordShow").innerHTML = cur.parts[0] + '<span class="blank" id="blank">?</span>' + cur.parts[2];
    ["er", "or", "ar"].forEach(function (c) {
      var b = document.createElement("button"); b.className = "choice"; b.textContent = c;
      b.onclick = function () { pick(c); }; $("choices").appendChild(b);
    });
    sayWord();
  } else {
    $("answer").classList.remove("hidden"); $("tileBtns").classList.remove("hidden");
    if (mode === 2) {
      $("wordShow").innerHTML = cur.tricky ? "Tricky word! 🤔" : "Bossy <b style='color:#ff5fa2'>" + cur.r + "</b> word";
      var letters = cur.w.split("");
      var extras = cur.tricky ? ["u", "m"] : (cur.r === "er" ? ["o", "a"] : cur.r === "or" ? ["e", "a"] : ["e", "o"]);
      makeTiles(shuffle(letters.concat(extras)));
    } else {
      $("wordShow").textContent = "👂 Listen, then spell!";
      makeTiles(shuffle("abcdefghijklmnoprstuxy".split("")).sort());
    }
    renderAnswer();
    sayWord();
  }
}

function makeTiles(arr) {
  arr.forEach(function (ch, i) {
    var t = document.createElement("button"); t.className = "tile"; t.textContent = ch; t.id = "t" + i;
    t.onclick = function () { tapTile(i, ch); }; $("tiles").appendChild(t);
  });
}
function tapTile(i, ch) {
  if (done) return;
  built.push(ch);
  if (mode === 2) { usedTiles.push(i); $("t" + i).classList.add("used"); }
  renderAnswer();
}
function undoTile() {
  if (done || !built.length) return;
  built.pop();
  if (mode === 2) { var i = usedTiles.pop(); $("t" + i).classList.remove("used"); }
  renderAnswer();
}
function renderAnswer(marks) {
  var h = "";
  for (var i = 0; i < built.length; i++) { var cls = marks ? (marks[i] ? "ok" : "bad") : ""; h += '<span class="' + cls + '">' + built[i] + "</span>"; }
  $("answer").innerHTML = h || "&nbsp;";
}

function hintFor(word) {
  if (word.tricky) return "Tricky! It sounds like \"sum\" but it's s-o-m-e. The e at the end is silent. 🤫";
  var where = word.parts[0] ? "after \"" + word.parts[0] + "\"" : "";
  return "Listen for the bossy R sound " + where + ". In " + word.w + " it's spelled \"" + word.r + "\"! 👑";
}

function pick(c) {
  if (done) return;
  if (c === cur.r) {
    done = true; $("blank").textContent = c;
    var pts = firstTry ? 2 : 1; score += pts; $("score").textContent = score;
    $("msg").textContent = "Yes! " + cur.w + " uses \"" + c + "\" 🎉 +" + pts;
    speak("Yes! " + cur.w);
    $("nextBtn").classList.remove("hidden");
  } else {
    firstTry = false; if (missed.indexOf(cur) < 0) missed.push(cur);
    $("msg").textContent = "Not quite! " + hintFor(cur);
  }
}

function check() {
  if (done) return;
  var guess = built.join("");
  if (guess === cur.w) {
    done = true;
    renderAnswer(cur.w.split("").map(function () { return true; }));
    var pts = firstTry ? 2 : 1; score += pts; $("score").textContent = score;
    $("msg").textContent = "Perfect! " + cur.w + " 🎉 +" + pts;
    speak("Perfect! " + cur.w);
    $("nextBtn").classList.remove("hidden");
  } else {
    firstTry = false; if (missed.indexOf(cur) < 0) missed.push(cur);
    var marks = built.map(function (ch, i) { return cur.w[i] === ch; });
    renderAnswer(marks);
    $("msg").textContent = "Green = right spot. " + hintFor(cur);
  }
}

function nextWord() {
  idx++;
  if (idx === queue.length && missed.length) {
    // missed words come back once for another try
    queue = queue.concat(missed.map(function (m) { return m; })); missed = [];
    $("msg").textContent = "";
  }
  if (idx >= queue.length) return finish();
  loadWord();
}

function finish() {
  $("game").classList.add("hidden"); $("end").classList.remove("hidden");
  var b = parseInt(localStorage.getItem(bestKey(mode)) || "0", 10);
  var newBest = score > b; if (newBest) localStorage.setItem(bestKey(mode), score);
  var max = (mode === 1 ? 9 : 10) * 2;
  var pct = score / max;
  $("endStars").textContent = pct >= 0.9 ? "⭐⭐⭐" : pct >= 0.6 ? "⭐⭐" : "⭐";
  $("endTitle").textContent = pct >= 0.9 ? "Bossy R Boss! 👑" : "Great practice! 💪";
  $("endMsg").textContent = "Score: " + score + (newBest ? " • NEW BEST! 🎉" : " • Best: " + b);
  speak(pct >= 0.9 ? "You are the Bossy R Boss!" : "Great practice!");
}
showBest();
</script>
</body>
</html>
